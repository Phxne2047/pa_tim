<header class="sticky top-0 z-50 border-b border-slate-200/80 bg-white/85 shadow-sm shadow-slate-200/40 backdrop-blur-xl">
  <div class="mx-auto grid min-h-[72px] w-[calc(100%-2rem)] max-w-6xl grid-cols-[1fr_auto_1fr] items-center">
    <a
      class="group flex shrink-0 items-center gap-2.5 justify-self-start text-slate-800 no-underline"
      routerLink="/customer-management"
    >
      <span class="grid size-10 place-items-center rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 text-xl text-white shadow-lg shadow-blue-600/30">
        🍱
      </span>
      <span class="flex flex-col leading-none">
        <strong class="text-[15px] font-extrabold tracking-[0.22em] text-slate-800">PA TIM</strong>
        <small class="mt-1 text-[9px] font-medium tracking-wide text-slate-400">DELIVERY MANAGER</small>
      </span>
    </a>

    @if (!isRiderMode) {
      <nav class="col-start-2 flex items-center justify-center gap-1 rounded-2xl border border-slate-200/80 bg-slate-100/70 p-1.5 shadow-inner">
        @for (item of navigationItems; track item.route) {
          <a
            class="group relative inline-flex min-w-28 items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-xs font-semibold transition-all duration-200 no-underline text-slate-600 hover:text-slate-900"
            [routerLink]="item.route"
            routerLinkActive="!bg-white !text-blue-700 !shadow-sm"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>
    } @else {
      <div></div>
    }

    <div class="flex items-center justify-end justify-self-end">
      <div class="flex items-center rounded-2xl bg-slate-950 p-1 shadow-md shadow-slate-950/20">
        @if (!isRiderMode) {
          <a
            routerLink="/customer-management"
            class="flex items-center gap-2 rounded-xl bg-white/10 px-3.5 py-2 text-xs font-bold text-white shadow-sm transition-all no-underline"
          >
            <span>🧑‍🍳</span>
            <span>เจ้าของร้าน</span>
          </a>
        }

        <a
          routerLink="/rider"
          [class]="isRiderMode 
            ? 'bg-orange-500 text-white shadow-md shadow-orange-500/40' 
            : 'text-slate-400 hover:text-slate-200'"
          class="flex items-center gap-2 rounded-xl px-3.5 py-2 text-xs font-bold transition-all no-underline"
        >
          <span>🛵</span>
          <span>สำหรับไรเดอร์</span>
        </a>
      </div>
    </div>

  </div>
</header>
